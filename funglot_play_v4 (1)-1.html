let state=loadState(),currentPage="home",quizState=null,wordIndex=0,wordSearch="",sentenceSearch="",translatorHistory=[],showSignup=false,screenMode="splash";
function loadState(){try{return {...DEFAULT_STATE,...JSON.parse(localStorage.getItem(STORE_KEY)||"{}")}}catch{return {...DEFAULT_STATE}}}
function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function allWords(){return [...SAMPLE_WORDS,...(state.customWords||[])]}
function allSentences(){return [...SAMPLE_SENTENCES,...(state.customSentences||[])]}
function toast(message){const el=document.createElement("div");el.className="toast";el.textContent=message;document.getElementById("toastHost").append(el);setTimeout(()=>el.remove(),3000)}
function confetti(){if(state.settings.reduceMotion||matchMedia("(prefers-reduced-motion: reduce)").matches)return;for(let i=0;i<40;i++){let e=document.createElement("i");e.className="confetti";e.style.left=Math.random()*100+"vw";e.style.background=["#8b7cff","#5ce1c3","#ffd166","#ff6b86","#4b9cff"][i%5];e.style.animationDelay=Math.random()*.5+"s";document.body.append(e);setTimeout(()=>e.remove(),2400)}}
function addXP(amount){state.xp+=amount;state.gems+=Math.max(1,Math.floor(amount/10));state.activity.unshift({date:today(),xp:amount,kind:"practice"});state.activity=state.activity.slice(0,30);saveState()}
function markDaily(){let d=today();if(state.lastDay!==d){if(state.lastDay===new Date(Date.now()-86400000).toISOString().slice(0,10))state.streak=(state.streak||0)+1;else state.streak=1;state.lastDay=d;saveState()}}
function go(page){currentPage=page;quizState=null;render();window.scrollTo({top:0,behavior:"smooth"})}
function logo(){return `<div class="brand"><div class="logo">F</div><div>FUNGLOT <span style="color:var(--brand2)">PLAY</span><div class="small muted" style="font-weight:600;letter-spacing:0">Learn beyond words</div></div></div>`}
function navItem(page,icon,label){return `<button class="nav-btn ${currentPage===page?"active":""}" data-go="${page}"><span class="nav-icon">${icon}</span>${label}</button>`}
function splash(){return `<main class="splash-screen"><div class="splash-glow"></div><div class="splash-content"><div class="splash-logo-wrap"><div class="splash-logo">F</div><div class="splash-orbit orbit-one"></div><div class="splash-orbit orbit-two"></div></div><div class="eyebrow">YOUR LANGUAGE UNIVERSE</div><h1>FUNGLOT <span>PLAY</span></h1><p class="splash-tagline">শুধু ভাষা শেখা নয়—শব্দ, অনুবাদ, বাক্য, কুইজ ও বিশ্বজুড়ে শেখার নতুন অভিজ্ঞতা।</p><div class="splash-pills"><span>📚 Vocabulary</span><span>🌐 Translator</span><span>🏆 Challenges</span></div><button class="btn primary splash-enter" id="enterApp">${state.onboarded?("চালিয়ে যাও, "+esc(state.name)+" →"):"শুরু করি →"}</button>${state.onboarded?'<button class="btn ghost splash-switch" id="switchAccount">অন্য প্রোফাইল / নতুন করে শুরু</button>':""}<div class="splash-footer">LEARN · PRACTICE · CONNECT</div></div></main>`}
function welcome(){return `<div class="welcome"><div class="welcome-panel"><section class="welcome-art"><div>${logo()}<div class="eyebrow" style="margin-top:45px">Your language universe</div><h1>শিখুন। বলুন।<br>বিশ্বের সঙ্গে<br><span style="color:var(--brand2)">যুক্ত হোন।</span></h1><p>শব্দভান্ডার, অনুবাদ, বাক্য, কুইজ ও শেখার অগ্রগতি—এক জায়গায়।</p><div class="orbit"><div class="orbit-core">🌍</div></div></div><div class="badge-row"><span class="pill">📚 Vocabulary</span><span class="pill">🌐 Translate</span><span class="pill">🏆 Practice</span></div></section><section class="welcome-form"><div class="eyebrow">START YOUR JOURNEY</div><h2>${showSignup?"অ্যাকাউন্ট তৈরি করুন":"স্বাগতম!"}</h2><p class="muted">${showSignup?"আপনার শেখার প্রোফাইল তৈরি করুন।":"শুরু করতে প্রোফাইল তৈরি করো। Google/Apple/email-এর আসল লগইন পরে সার্ভার দিয়ে যুক্ত হবে।"}</p><form id="welcomeForm"><div class="field"><label for="userName">আপনার নাম</label><input id="userName" name="name" maxlength="40" required placeholder="যেমন: Mashrafi" value="${esc(state.name)}"></div><div class="field"><label for="userEmail">ইমেইল (ঐচ্ছিক)</label><input id="userEmail" name="email" type="email" maxlength="120" placeholder="you@example.com" value="${esc(state.email)}"></div><div class="field"><label for="nativeLang">আপনি কোন ভাষায় অর্থ দেখতে চান?</label><select id="nativeLang"><option value="bn">বাংলা</option><option value="en">English</option><option value="hi">हिन्दी</option><option value="ar">العربية</option><option value="ur">اردو</option><option value="es">Español</option><option value="fr">Français</option><option value="ja">日本語</option></select></div><button class="btn primary block" type="submit">${showSignup?"প্রোফাইল তৈরি করুন":"শুরু করুন →"}</button></form><p class="small muted" style="margin-top:16px">এটি আপাতত লোকাল ডেমো। এই ফর্মে সত্যিকারের পাসওয়ার্ড বা ব্যাংক তথ্য দেবেন না।</p><div class="auth-provider-row"><button type="button" class="btn block" data-auth-provider="Google">G · Google দিয়ে চালিয়ে যান <span class="small muted">(পরে)</span></button><button type="button" class="btn block" data-auth-provider="Apple"> Apple দিয়ে চালিয়ে যান <span class="small muted">(পরে)</span></button></div><button class="btn ghost block" id="toggleWelcome">${showSignup?"ফিরে যান":"নতুন? প্রোফাইল তৈরি করুন"}</button></section></div></div>`}
function shell(){return `<div class="app-shell"><header class="topbar">${logo()}<div class="top-actions"><span class="pill">💎 <b id="gemCount">${state.gems}</b></span><span class="pill">🔥 ${state.streak||0} দিন</span><button class="btn ghost hide-mobile" data-go="profile">⚙️ সেটিংস</button><div class="user-chip"><div class="avatar">${esc((state.name||"F").slice(0,1).toUpperCase())}</div><span class="small">${esc(state.name||"Learner")}</span></div></div></header><div class="layout"><aside class="sidebar"><div class="nav-label">শেখা</div>${navItem("home","🏠","হোম")}${navItem("lessons","📚","পাঠ")}${navItem("vocabulary","🔤","শব্দভান্ডার")}${navItem("sentences","💬","বাক্য অনুশীলন")}${navItem("translator","🌐","অনুবাদক")}${navItem("practice","🎯","কুইজ ও অনুশীলন")}<div class="nav-label">কমিউনিটি</div>${navItem("leaderboard","🏆","লিডারবোর্ড")}${navItem("friends","👥","বন্ধু")}${navItem("achievements","🎖️","অর্জন")}${navItem("premium","💎","Premium")}${navItem("profile","⚙️","প্রোফাইল ও ডেটা")}<div class="notice small" style="margin-top:16px">✨ <b>AI:</b> আপাতত বন্ধ। পরে নিরাপদ সার্ভারের মাধ্যমে যুক্ত হবে।</div></aside><main class="main" id="mainContent">${pageContent()}</main></div><nav class="bottom-nav">${[["home","🏠","হোম"],["vocabulary","🔤","শব্দ"],["translator","🌐","অনুবাদ"],["practice","🎯","কুইজ"],["profile","👤","আমি"]].map(([p,i,l])=>`<button class="${currentPage===p?"active":""}" data-go="${p}"><span>${i}</span>${l}</button>`).join("")}</nav><footer class="footer">FUNGLOT PLAY · Prototype v3 · আপনার অগ্রগতি এই ব্রাউজারে সংরক্ষিত হয়</footer></div>`}
function homePage(){let done=state.completed.length;return `<div class="page"><section class="hero"><div><div class="eyebrow">YOUR NEXT LEVEL STARTS HERE</div><h1>হ্যালো, ${esc(state.name||"Learner")}! 👋<br>আজ কী শিখবে?</h1><p>প্রতিদিন অল্প অনুশীলন—দীর্ঘমেয়াদে বড় অগ্রগতি। শব্দ শিখুন, বাক্য তৈরি করুন, অনুবাদ করুন, আর নিজের স্কিল বাড়ান।</p><div class="actions"><button class="btn primary" data-go="lessons">📚 শেখা চালিয়ে যান</button><button class="btn" data-go="practice">🎯 কুইজ শুরু</button></div></div><div class="hero-visual"><div class="orbit"><div class="orbit-core">🪄</div></div></div></section><div class="grid stats"><div class="stat"><div class="label">মোট XP</div><div class="value">⚡ ${state.xp}</div></div><div class="stat"><div class="label">সম্পন্ন পাঠ</div><div class="value">📘 ${done}/${LESSONS.length}</div></div><div class="stat"><div class="label">শেখা শব্দ</div><div class="value">🔤 ${state.learned.length}</div></div><div class="stat"><div class="label">সঠিক উত্তর</div><div class="value">✅ ${state.quizCorrect}</div></div></div><div class="section-head"><h2>তোমার শেখার জায়গা</h2><span class="muted small">এক জায়গায় সব</span></div><div class="grid feature-grid">${featureCard("📚","পাঠ","ধাপে ধাপে শেখার লেসন","lessons","পাঠ খুলুন")}${featureCard("🔤","৫০,০০০+ শব্দের জন্য প্রস্তুত","নিজের শব্দের CSV/JSON ইমপোর্ট করুন","vocabulary","শব্দ দেখুন")}${featureCard("🌐","অনুবাদক","ডেমো অভিধান ও কপি ফিচার","translator","অনুবাদ করুন")}${featureCard("💬","বাক্য অনুশীলন","বাক্য, অর্থ ও উচ্চারণ শুনুন","sentences","বাক্য শিখুন")}${featureCard("🏆","প্রতিযোগিতা","ডেমো স্কোরবোর্ড ও নিজের অগ্রগতি","leaderboard","দেখুন")}${featureCard("💎","Premium","পরিকল্পিত পেইড সুবিধার পেজ","premium","প্ল্যান দেখুন")}</div><div class="section-head"><h2>আজকের অগ্রগতি</h2><span class="muted small">${Math.min(100,Math.round(done/LESSONS.length*100))}%</span></div><div class="card"><div class="progress"><span style="width:${Math.min(100,Math.round(done/LESSONS.length*100))}%"></span></div><p class="muted small">একটি পাঠ শেষ করুন বা কয়েকটি শব্দ অনুশীলন করুন। অগ্রগতি এই ডিভাইসে সেভ হবে।</p><div class="actions"><button class="btn" data-go="vocabulary">শব্দ অনুশীলন</button><button class="btn" data-go="sentences">বাক্য অনুশীলন</button></div></div><div class="section-head"><h2>বিজ্ঞাপনের স্বস্তিদায়ক জায়গা</h2></div><div class="ad-slot"><div><strong>বিজ্ঞাপনের জায়গা · এখন বিজ্ঞাপন দেখানো হয় না</strong><div>বাস্তব বিজ্ঞাপন নেটওয়ার্ক ও নীতিমালা যুক্ত হলে এখানে সীমিত, অ-ব্যাঘাতকারী বিজ্ঞাপন বসবে।</div></div><span class="pill">Ad placeholder</span></div></div>`}
function featureCard(icon,title,desc,page,action){return `<article class="card feature"><div class="tile">${icon}</div><div><h3>${title}</h3><p>${desc}</p><button class="btn" data-go="${page}">${action} →</button></div></article>`}
function lessonsPage(){return `<div class="page"><div class="section-head"><div><div class="eyebrow">LEARNING PATH</div><h2>পাঠ ও লার্নিং পাথ</h2></div><span class="pill">${state.completed.length}/${LESSONS.length} সম্পন্ন</span></div><div class="grid feature-grid">${LESSONS.map((l,i)=>`<article class="card"><div class="badge-row"><span class="pill">${l.level}</span><span class="pill">⏱ ${l.time}</span>${state.completed.includes(l.id)?'<span class="pill">✅ সম্পন্ন</span>':""}</div><h3 style="margin-bottom:5px">${i+1}. ${l.title}</h3><p class="muted">${l.desc}</p><p class="small">${l.words.map(esc).join(" · ")}</p><button class="btn ${state.completed.includes(l.id)?"":"primary"} block" data-lesson="${l.id}">${state.completed.includes(l.id)?"আবার অনুশীলন":"পাঠ শুরু করুন"}</button></article>`).join("")}</div><div class="notice warn" style="margin-top:15px">এই সংস্করণে ৫টি ডেমো পাঠ আছে। পূর্ণ কোর্সের কনটেন্ট আলাদা JSON/CSV ফাইলে যোগ করা যাবে।</div></div>`}
function vocabularyPage(){let words=allWords().filter(w=>(w.word+" "+w.meaning+" "+(w.type||"")).toLowerCase().includes(wordSearch.toLowerCase()));return `<div class="page"><div class="section-head"><div><div class="eyebrow">WORD POWER</div><h2>শব্দভান্ডার</h2><p class="muted small">ডেমো শব্দ: ${allWords().length} · CSV/JSON দিয়ে হাজার হাজার শব্দ আমদানি করা যাবে</p></div><button class="btn primary" id="importWordsBtn">＋ শব্দ ইমপোর্ট</button></div><input class="searchbox" id="wordSearch" placeholder="ইংরেজি শব্দ বা বাংলা অর্থ খুঁজুন…" value="${esc(wordSearch)}"><div class="card" style="margin-top:14px"><div class="word-card"><div><div class="word">Daily word · ${esc(SAMPLE_WORDS[wordIndex%SAMPLE_WORDS.length].word)}</div><div class="meaning">${esc(SAMPLE_WORDS[wordIndex%SAMPLE_WORDS.length].meaning)}</div></div><button class="btn" id="nextWord">পরের শব্দ ↻</button></div>${words.slice(0,100).map(w=>`<div class="word-card"><div><div class="word">${esc(w.word)} <span class="pill">${esc(w.level||"A1")}</span></div><div class="meaning">${esc(w.meaning)} · <span class="small">${esc(w.type||"শব্দ")}</span></div><div class="small muted">${esc(w.example||"")}</div></div><div class="actions"><button class="btn" data-speak="${esc(w.word)}" title="শুনুন">🔊</button><button class="btn ${state.saved.includes(w.word)?"success":""}" data-saveword="${esc(w.word)}">${state.saved.includes(w.word)?"★":"☆"}</button><button class="btn" data-learnword="${esc(w.word)}">${state.learned.includes(w.word)?"✓":"শিখেছি"}</button></div></div>`).join("")||'<div class="empty">কোনো শব্দ পাওয়া যায়নি।</div>'}</div><div class="notice" style="margin-top:14px">বড় ডেটাসেটের জন্য আলাদা <b>data/vocabulary.json</b> ফাইল ব্যবহার করো। ব্রাউজারে ৫০–৬০ হাজার শব্দ ঢুকিয়ে HTML অস্বাভাবিক বড় না করাই ভালো।</div></div>`}
function sentencesPage(){let items=allSentences().filter(s=>(s.source+" "+s.bn+" "+(s.topic||"")).toLowerCase().includes(sentenceSearch.toLowerCase()));return `<div class="page"><div class="section-head"><div><div class="eyebrow">SENTENCE LAB</div><h2>বাক্য অনুশীলন</h2><p class="muted small">নমুনা বাক্য: ${allSentences().length} · ৫–১০ হাজার বাক্য আলাদা ডেটা ফাইলে রাখা যাবে</p></div><button class="btn primary" id="importSentencesBtn">＋ বাক্য ইমপোর্ট</button></div><input class="searchbox" id="sentenceSearch" placeholder="বাক্য, অর্থ বা বিষয় খুঁজুন…" value="${esc(sentenceSearch)}"><div class="grid" style="margin-top:14px">${items.slice(0,100).map((s,i)=>`<article class="card"><div class="badge-row"><span class="pill">${esc(s.level||"A1")}</span><span class="pill">${esc(s.topic||"General")}</span></div><h3>${esc(s.source)}</h3><p class="muted">${esc(s.bn)}</p><div class="actions"><button class="btn" data-speak="${esc(s.source)}">🔊 শুনুন</button><button class="btn" data-copysentence="${i}">কপি</button></div></article>`).join("")||'<div class="empty">কোনো বাক্য পাওয়া যায়নি।</div>'}</div></div>`}
function translatorPage(){return `<div class="page"><div class="section-head"><div><div class="eyebrow">LANGUAGE BRIDGE</div><h2>অনুবাদক</h2><p class="muted small">এই ডেমোতে সীমিত অভিধান-ভিত্তিক অনুবাদ আছে; পূর্ণ AI/অনলাইন অনুবাদ এখনো যুক্ত নয়।</p></div><span class="pill">AI OFF</span></div><div class="card"><div class="two-col"><div class="field"><label for="sourceLang">যে ভাষা থেকে</label><select id="sourceLang"><option value="en">English</option><option value="bn">বাংলা</option></select></div><div class="field"><label for="targetLang">যে ভাষায়</label><select id="targetLang"><option value="bn">বাংলা</option><option value="en">English</option></select></div></div><div class="field"><label for="translateInput">লেখা লিখুন</label><textarea id="translateInput" placeholder="Type a word or sentence here…"></textarea></div><div class="actions"><button class="btn primary" id="translateBtn">অনুবাদ করুন</button><button class="btn" id="swapLang">⇄ ভাষা বদল</button><button class="btn" id="clearTranslate">মুছুন</button></div><div class="section-head"><h2>ফলাফল</h2><button class="btn" id="copyTranslation">কপি</button></div><div class="card translator-result" id="translationOutput" aria-live="polite">আপনার অনুবাদ এখানে দেখা যাবে।</div><div class="notice warn" style="margin-top:14px">বাস্তব ও নির্ভরযোগ্য বহু-ভাষার অনুবাদের জন্য আলাদা translation API বা নিজস্ব সার্ভার লাগবে। ব্রাউজারে API secret রাখা নিরাপদ নয়।</div></div><div class="section-head"><h2>দ্রুত চেষ্টা করুন</h2></div><div class="badge-row">${["Good morning","Thank you","How are you?","আমি ইংরেজি শিখছি"].map(x=>`<button class="btn" data-trytranslate="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`}
function practicePage(){if(quizState)return quizRender();return `<div class="page"><div class="section-head"><div><div class="eyebrow">PRACTICE ARENA</div><h2>কুইজ ও অনুশীলন</h2><p class="muted">প্রশ্নের উত্তর দিয়ে XP অর্জন করো।</p></div><span class="pill">❤️ ${state.lives} lives</span></div><div class="grid feature-grid"><article class="card"><div class="tile">⚡</div><h3>দ্রুত কুইজ</h3><p class="muted">১০টি নমুনা প্রশ্ন। প্রতিটি সঠিক উত্তরে XP।</p><button class="btn primary block" id="startQuiz">কুইজ শুরু করুন</button></article><article class="card"><div class="tile">🧠</div><h3>শব্দ রিভিশন</h3><p class="muted">সংরক্ষিত শব্দগুলো আবার দেখুন।</p><button class="btn block" data-go="vocabulary">শব্দ রিভিশন</button></article><article class="card"><div class="tile">🎙️</div><h3>উচ্চারণ অনুশীলন</h3><p class="muted">ব্রাউজার সমর্থন করলে শব্দ শুনতে পারবে।</p><button class="btn block" data-speak="Learning every day makes a difference.">উচ্চারণ শুনুন</button></article></div><div class="card" style="margin-top:14px"><h3>তোমার কুইজ পরিসংখ্যান</h3><div class="grid stats"><div><div class="muted small">কুইজ উত্তর</div><div class="value">${state.quizPlayed}</div></div><div><div class="muted small">সঠিক উত্তর</div><div class="value">${state.quizCorrect}</div></div><div><div class="muted small">XP</div><div class="value">${state.xp}</div></div><div><div class="muted small">সঠিকতার হার</div><div class="value">${state.quizPlayed?Math.round(state.quizCorrect/state.quizPlayed*100):0}%</div></div></div></div></div>`}
function quizRender(){let q=quizState.qs[quizState.index];return `<div class="page"><div class="section-head"><div><div class="eyebrow">QUIZ TIME</div><h2>${quizState.finished?"কুইজ সম্পন্ন!":"প্রশ্ন "+(quizState.index+1)+" / "+quizState.qs.length}</h2></div><span class="pill">⚡ ${quizState.score} XP</span></div>${quizState.finished?`<div class="card" style="text-align:center;padding:35px"><div style="font-size:3.5rem">🏆</div><h2>দারুণ চেষ্টা!</h2><p class="muted">তুমি ${quizState.correct}টি সঠিক উত্তর দিয়েছ।</p><div class="actions" style="justify-content:center"><button class="btn primary" id="restartQuiz">আবার খেলুন</button><button class="btn" data-go="home">হোমে ফিরুন</button></div></div>`:`<div class="card"><div class="quiz-progress">${quizState.qs.map((_,i)=>`<span class="${i<=quizState.index?"done":""}"></span>`).join("")}</div><h2>${esc(q.q)}</h2><div id="quizChoices">${q.options.map((o,i)=>`<button class="quiz-choice" data-answer="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="quizFeedback" class="muted small" style="margin-top:12px" aria-live="polite"></div><button class="btn primary block hidden" id="nextQuestion" style="margin-top:14px">পরের প্রশ্ন →</button></div>`}</div>`}
function leaderboardPage(){let rows=[{name:state.name||"তুমি",xp:state.xp,you:true},{name:"Ayesha",xp:460},{name:"Rahim",xp:385},{name:"Nadia",xp:320},{name:"Tanvir",xp:275}].sort((a,b)=>b.xp-a.xp);return `<div class="page"><div class="section-head"><div><div class="eyebrow">FRIENDLY COMPETITION</div><h2>লিডারবোর্ড</h2></div><span class="pill">সাপ্তাহিক · ডেমো</span></div><div class="notice warn">এখানে অন্য নাম ও স্কোর নমুনা। আসল গ্লোবাল লিডারবোর্ডের জন্য সার্ভার-সাইড স্কোর যাচাই দরকার—এই ব্রাউজারের স্কোর বিশ্বাসযোগ্য নয়।</div><div class="card" style="margin-top:14px"><div class="table-wrap"><table><thead><tr><th>স্থান</th><th>শিক্ষার্থী</th><th>XP</th></tr></thead><tbody>${rows.map((r,i)=>`<tr style="${r.you?"background:#27244c":""}"><td>${["🥇","🥈","🥉"][i]||i+1}</td><td>${esc(r.name)} ${r.you?"(তুমি)":""}</td><td>⚡ ${r.xp}</td></tr>`).join("")}</tbody></table></div></div><div class="section-head"><h2>চ্যালেঞ্জ</h2></div><div class="grid feature-grid"><article class="card"><h3>📆 ৭ দিনের স্ট্রিক</h3><p class="muted">প্রতিদিন অনুশীলন করো।</p><div class="progress"><span style="width:${Math.min(100,(state.streak||0)/7*100)}%"></span></div><p class="small">${state.streak||0}/7 দিন</p></article><article class="card"><h3>🎯 ১০০ XP লক্ষ্য</h3><p class="muted">এই লক্ষ্যটি নিজের জন্য।</p><div class="progress"><span style="width:${Math.min(100,state.xp)}%"></span></div><p class="small">${Math.min(100,state.xp)}/100 XP</p></article></div></div>`}
function friendsPage(){return `<div class="page"><div class="section-head"><div><div class="eyebrow">LEARN TOGETHER</div><h2>বন্ধু ও চ্যালেঞ্জ</h2></div><span class="pill">👥 ${state.friends.length} বন্ধু</span></div><div class="card"><h3>বন্ধু যোগ করার প্রস্তুতি</h3><p class="muted">এখন নাম লোকাল তালিকায় যোগ হবে। বাস্তব invite link, বন্ধু খোঁজা, চ্যাট বা প্রতিযোগিতা চালাতে অ্যাকাউন্ট সার্ভার ও abuse-prevention দরকার।</p><form id="friendForm" class="inline-form"><input class="searchbox" name="friend" required maxlength="40" placeholder="বন্ধুর নাম লিখুন"><button class="btn primary">＋ যোগ</button></form><div style="margin-top:14px">${state.friends.map((f,i)=>`<div class="word-card"><div class="user-chip"><div class="avatar">${esc(f.slice(0,1).toUpperCase())}</div><div><b>${esc(f)}</b><div class="small muted">বন্ধু · লোকাল ডেমো</div></div></div><button class="btn danger" data-removefriend="${i}">সরান</button></div>`).join("")||'<div class="empty">এখনো কাউকে যোগ করোনি।</div>'}</div></div><div class="grid feature-grid" style="margin-top:14px"><article class="card"><h3>⚔️ বন্ধু চ্যালেঞ্জ</h3><p class="muted">ভবিষ্যৎ ফিচার: দৈনিক শব্দ, সময়ভিত্তিক কুইজ।</p></article><article class="card"><h3>💬 নিরাপদ কমিউনিটি</h3><p class="muted">ভবিষ্যতে রিপোর্ট, ব্লক, গোপনীয়তা ও মডারেশন থাকবে।</p></article></div></div>`}
function achievementsPage(){let items=[["🌱","শুরু করেছ",state.xp>=1],["📘","প্রথম পাঠ",state.completed.length>=1],["🔤","১০টি শব্দ",state.learned.length>=10],["⚡","১০০ XP",state.xp>=100],["🔥","৩ দিনের স্ট্রিক",state.streak>=3],["🏆","কুইজ মাস্টার",state.quizCorrect>=10]];return `<div class="page"><div class="section-head"><div><div class="eyebrow">MILESTONES</div><h2>অর্জন ও ব্যাজ</h2></div><span class="pill">${items.filter(x=>x[2]).length}/${items.length} আনলক</span></div><div class="grid feature-grid">${items.map(([e,n,ok])=>`<div class="badge-item ${ok?"":"locked"}"><div class="emoji">${ok?e:"🔒"}</div><b>${n}</b><div class="small muted">${ok?"আনলক হয়েছে":"চর্চা চালিয়ে যাও"}</div></div>`).join("")}</div><div class="notice" style="margin-top:14px">ব্যাজগুলো বর্তমান ডেমো ডেটা থেকে হিসাব করা হয়। ভবিষ্যতে সার্ভার থেকে নির্ভরযোগ্যভাবে আনলক হবে।</div></div>`}
function premiumPage(){return `<div class="page"><div class="section-head"><div><div class="eyebrow">MORE ROOM TO GROW</div><h2>FUNGLOT PLAY Premium</h2></div><span class="pill">পেমেন্ট এখন বন্ধ</span></div><section class="hero"><div><div class="eyebrow">COMING WHEN READY</div><h1>আরও মনোযোগ।<br>আরও শেখা।</h1><p>Premium-এ বিজ্ঞাপন কমানো/বন্ধ, অফলাইন লেসন, উন্নত রিভিশন ও অতিরিক্ত শেখার টুল দেওয়া যেতে পারে। সুবিধাগুলো তৈরি ও যাচাই না হওয়া পর্যন্ত কোনো টাকা নেওয়া হচ্ছে না।</p><button class="btn gold" id="premiumNotify">প্রিমিয়াম আপডেট চাই</button></div><div class="hero-visual"><div class="orbit"><div class="orbit-core">💎</div></div></div></section><div class="grid feature-grid" style="margin-top:14px">${[["🚫","বিজ্ঞাপন নিয়ন্ত্রণ","প্ল্যানে প্রতিশ্রুতি অনুযায়ী বিজ্ঞাপন কমানো/বন্ধ"],["📥","অফলাইন প্যাক","অনুমোদিত পাঠ ও শব্দ ডাউনলোড"],["🧠","উন্নত রিভিশন","ব্যক্তিগত পুনরাবৃত্তি পরিকল্পনা"],["🌍","ভাষা প্যাক","অতিরিক্ত ভাষা ও শেখার বিষয়"]].map(([i,t,d])=>`<article class="card"><div class="tile">${i}</div><h3>${t}</h3><p class="muted">${d}</p></article>`).join("")}</div><div class="notice warn" style="margin-top:14px">এখনো কোনো পেমেন্ট প্রসেসর, সাবস্ক্রিপশন বা বিজ্ঞাপন SDK যুক্ত নেই। বাস্তব পেমেন্টের আগে কোম্পানি/ব্যবসার যোগ্যতা, কর, রিফান্ড, গোপনীয়তা, অভিভাবকীয় সম্মতি যেখানে প্রযোজ্য এবং স্থানীয় আইন যাচাই করতে হবে।</div></div>`}
function profilePage(){return `<div class="page"><div class="section-head"><div><div class="eyebrow">YOUR ACCOUNT</div><h2>প্রোফাইল ও ডেটা</h2></div></div><div class="two-col"><section class="card"><h3>প্রোফাইল</h3><form id="profileForm"><div class="field"><label>নাম</label><input name="name" maxlength="40" required value="${esc(state.name)}"></div><div class="field"><label>ইমেইল</label><input name="email" type="email" maxlength="120" value="${esc(state.email)}"></div><button class="btn primary">পরিবর্তন সেভ</button></form><hr style="border-color:var(--line);margin:22px 0"><h3>পছন্দ</h3><label class="word-card"><span>🔊 শব্দের উচ্চারণ</span><input id="soundToggle" type="checkbox" ${state.settings.sound?"checked":""}></label><label class="word-card"><span>কম অ্যানিমেশন</span><input id="motionToggle" type="checkbox" ${state.settings.reduceMotion?"checked":""}></label></section><section class="card"><h3>তোমার ডেটা</h3><p class="muted small">এই সংস্করণে অগ্রগতি এই ব্রাউজারের localStorage-এ থাকে। ব্রাউজার ডেটা মুছে গেলে হারাতে পারে।</p><div class="actions"><button class="btn primary" id="exportData">⬇️ ব্যাকআপ ডাউনলোড</button><button class="btn" id="importData">⬆️ ব্যাকআপ ইমপোর্ট</button></div><hr style="border-color:var(--line);margin:22px 0"><h3>ডেটা রিসেট</h3><p class="muted small">রিসেট করলে এই ডিভাইসের লোকাল প্রোফাইল ও অগ্রগতি মুছে যাবে। আগে ব্যাকআপ নাও।</p><button class="btn danger" id="resetData">লোকাল ডেটা রিসেট</button></section></div><div class="section-head"><h2>ভবিষ্যতের সংযোগ</h2></div><div class="grid feature-grid"><article class="card"><h3>🔐 আসল লগইন</h3><p class="muted">Supabase/Firebase Auth বা নিজস্ব backend প্রয়োজন।</p></article><article class="card"><h3>🗄️ ক্লাউড ডেটাবেস</h3><p class="muted">শব্দ, বাক্য, প্রোফাইল, XP ও বন্ধু সার্ভারে থাকবে।</p></article><article class="card"><h3>🛡️ নিরাপত্তা</h3><p class="muted">API key frontend-এ নয়; server-side validation ও rate limits দরকার।</p></article></div></div>`}
function pageContent(){switch(currentPage){case"home":return homePage();case"lessons":return lessonsPage();case"vocabulary":return vocabularyPage();case"sentences":return sentencesPage();case"translator":return translatorPage();case"practice":return practicePage();case"leaderboard":return leaderboardPage();case"friends":return friendsPage();case"achievements":return achievementsPage();case"premium":return premiumPage();case"profile":return profilePage();default:return homePage()}}
function render(){const app=document.getElementById("app");if(screenMode==="splash"){app.innerHTML=splash();bindEvents();return}if(screenMode==="auth"){app.innerHTML=welcome();bindEvents();return}app.innerHTML=state.onboarded?shell():welcome();bindEvents()}
function speak(text){if(!state.settings.sound){toast("সেটিংসে উচ্চারণ বন্ধ আছে।");return}if(!("speechSynthesis"in window)){toast("এই ব্রাউজারে voice support নেই।");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=/[\u0980-\u09FF]/.test(text)?"bn-BD":"en-US";u.rate=.88;speechSynthesis.speak(u)}
function translateDemo(text,from,to){let t=text.trim();if(!t)return "অনুবাদের জন্য লেখা লিখুন।";if(from===to)return t;const dict={"good morning":"সুপ্রভাত","thank you":"ধন্যবাদ","thanks":"ধন্যবাদ","how are you?":"আপনি কেমন আছেন?","hello":"হ্যালো","please":"দয়া করে","i am learning english":"আমি ইংরেজি শিখছি","আমি ইংরেজি শিখছি":"I am learning English.","সুপ্রভাত":"Good morning.","ধন্যবাদ":"Thank you.","আপনি কেমন আছেন?":"How are you?"};let key=t.toLowerCase();if(dict[key])return dict[key];let found=allWords().find(w=>w.word.toLowerCase()===key||w.meaning.toLowerCase()===key);if(found)return from==="en"?found.meaning:found.word;return "এই ডেমো অভিধানে অনুবাদটি নেই। পূর্ণ অনুবাদের জন্য অনুবাদ API যুক্ত করতে হবে।"}
function download(name,content,type="application/json"){let blob=new Blob([content],{type});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parseCSV(text){let lines=text.replace(/^\uFEFF/,"").trim().split(/\r?\n/);if(!lines.length)return [];let headers=lines.shift().split(",").map(x=>x.trim().toLowerCase());return lines.map(line=>{let cells=line.split(",");let o={};headers.forEach((h,i)=>o[h]=(cells[i]||"").trim());return o})}
function importFile(kind){let input=document.createElement("input");input.type="file";input.accept=".json,.csv,application/json,text/csv";input.onchange=async()=>{let f=input.files[0];if(!f)return;try{let raw=await f.text();let data=f.name.toLowerCase().endsWith(".csv")?parseCSV(raw):JSON.parse(raw);if(!Array.isArray(data))throw Error("ফাইলের মূল অংশে array/list থাকতে হবে");if(kind==="words"){let valid=data.map(x=>({word:String(x.word||x.english||"").trim(),meaning:String(x.meaning||x.bn||x.translation||"").trim(),type:String(x.type||"noun"),example:String(x.example||""),level:String(x.level||"A1")})).filter(x=>x.word&&x.meaning);if(!valid.length)throw Error("word এবং meaning কলাম/ফিল্ড দরকার");state.customWords=[...(state.customWords||[]),...valid];saveState();toast(valid.length+"টি শব্দ যোগ হয়েছে");render()}else{let valid=data.map(x=>({source:String(x.source||x.english||x.sentence||"").trim(),bn:String(x.bn||x.meaning||x.translation||"").trim(),level:String(x.level||"A1"),topic:String(x.topic||"General")})).filter(x=>x.source&&x.bn);if(!valid.length)throw Error("source এবং bn কলাম/ফিল্ড দরকার");state.customSentences=[...(state.customSentences||[]),...valid];saveState();toast(valid.length+"টি বাক্য যোগ হয়েছে");render()}}catch(e){toast("ফাইল পড়া যায়নি: "+e.message)}};input.click()}
function bindEvents(){
let enter=document.getElementById("enterApp");if(enter)enter.addEventListener("click",()=>{screenMode=state.onboarded?"app":"auth";render();if(state.onboarded)toast("আবার স্বাগতম, "+state.name+"!");});
let switchAccount=document.getElementById("switchAccount");if(switchAccount)switchAccount.addEventListener("click",()=>{screenMode="auth";showSignup=false;render()});
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
document.querySelectorAll("[data-speak]").forEach(b=>b.addEventListener("click",()=>speak(b.dataset.speak)));
document.querySelectorAll("[data-saveword]").forEach(b=>b.addEventListener("click",()=>{let w=b.dataset.saveword;state.saved=state.saved.includes(w)?state.saved.filter(x=>x!==w):[...state.saved,w];saveState();render()}));
document.querySelectorAll("[data-learnword]").forEach(b=>b.addEventListener("click",()=>{let w=b.dataset.learnword;if(!state.learned.includes(w)){state.learned.push(w);addXP(2);markDaily();toast("শব্দ শেখা হয়েছে! +2 XP");confetti()}render()}));
document.querySelectorAll("[data-lesson]").forEach(b=>b.addEventListener("click",()=>{let id=b.dataset.lesson;if(!state.completed.includes(id)){state.completed.push(id);addXP(15);markDaily();confetti();toast("পাঠ সম্পন্ন! +15 XP")}else toast("এই পাঠ আগে সম্পন্ন হয়েছে। আবার অনুশীলন করতে পারো।");saveState();render()}));
document.querySelectorAll("[data-trytranslate]").forEach(b=>b.addEventListener("click",()=>{document.getElementById("translateInput").value=b.dataset.trytranslate;document.getElementById("translationOutput").textContent=translateDemo(b.dataset.trytranslate,/[অ-য়]/.test(b.dataset.trytranslate)?"bn":"en",document.getElementById("targetLang").value)}));
document.querySelectorAll("[data-removefriend]").forEach(b=>b.addEventListener("click",()=>{state.friends.splice(+b.dataset.removefriend,1);saveState();render()}));
document.querySelectorAll("[data-copysentence]").forEach(b=>b.addEventListener("click",()=>{let s=allSentences().filter(s=>(s.source+" "+s.bn+" "+(s.topic||"")).toLowerCase().includes(sentenceSearch.toLowerCase())).slice(0,100)[+b.dataset.copysentence];navigator.clipboard?.writeText(s?.source||"").then(()=>toast("কপি হয়েছে")).catch(()=>toast("কপি করা যায়নি"))}));
let wf=document.getElementById("welcomeForm");if(wf)wf.addEventListener("submit",e=>{e.preventDefault();let fd=new FormData(wf);let n=String(fd.get("name")||"").trim();let email=String(fd.get("email")||"").trim();if(n.length<2){toast("কমপক্ষে ২ অক্ষরের নাম লিখুন।");return}state.name=n;state.email=email;state.onboarded=true;markDaily();saveState();screenMode="app";render();toast("স্বাগতম, "+n+"!");});
document.querySelectorAll("[data-auth-provider]").forEach(b=>b.addEventListener("click",()=>toast(b.dataset.authProvider+" লগইন এখনো যুক্ত হয়নি—আসল লগইনের জন্য backend/auth service লাগবে।")));
let tw=document.getElementById("toggleWelcome");if(tw)tw.addEventListener("click",()=>{showSignup=!showSignup;screenMode="auth";render()});
let ws=document.getElementById("wordSearch");if(ws)ws.addEventListener("input",e=>{wordSearch=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById("wordSearch");n.focus();n.setSelectionRange(pos,pos)});
let ss=document.getElementById("sentenceSearch");if(ss)ss.addEventListener("input",e=>{sentenceSearch=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById("sentenceSearch");n.focus();n.setSelectionRange(pos,pos)});
let nw=document.getElementById("nextWord");if(nw)nw.addEventListener("click",()=>{wordIndex=(wordIndex+1)%SAMPLE_WORDS.length;render()});
let iw=document.getElementById("importWordsBtn");if(iw)iw.addEventListener("click",()=>importFile("words"));
let is=document.getElementById("importSentencesBtn");if(is)is.addEventListener("click",()=>importFile("sentences"));
let tb=document.getElementById("translateBtn");if(tb)tb.addEventListener("click",()=>{let out=translateDemo(document.getElementById("translateInput").value,document.getElementById("sourceLang").value,document.getElementById("targetLang").value);document.getElementById("translationOutput").textContent=out;translatorHistory.unshift({input:document.getElementById("translateInput").value,output:out});translatorHistory=translatorHistory.slice(0,10)});
let sl=document.getElementById("swapLang");if(sl)sl.addEventListener("click",()=>{let a=document.getElementById("sourceLang"),b=document.getElementById("targetLang");let v=a.value;a.value=b.value;b.value=v});
let cl=document.getElementById("clearTranslate");if(cl)cl.addEventListener("click",()=>{document.getElementById("translateInput").value="";document.getElementById("translationOutput").textContent="আপনার অনুবাদ এখানে দেখা যাবে।"});
let cp=document.getElementById("copyTranslation");if(cp)cp.addEventListener("click",()=>{navigator.clipboard?.writeText(document.getElementById("translationOutput").textContent).then(()=>toast("ফলাফল কপি হয়েছে")).catch(()=>toast("কপি করা যায়নি"))});
let sq=document.getElementById("startQuiz");if(sq)sq.addEventListener("click",()=>{let qs=[...QUIZ].sort(()=>Math.random()-.5).slice(0,10).map(q=>({...q,options:[...q.options],answer:q.answer}));quizState={qs,index:0,score:0,correct:0,answered:false,finished:false};render()});
document.querySelectorAll("[data-answer]").forEach(b=>b.addEventListener("click",()=>{if(!quizState||quizState.answered)return;quizState.answered=true;let q=quizState.qs[quizState.index],chosen=+b.dataset.answer;document.querySelectorAll("[data-answer]").forEach(x=>{x.disabled=true;if(+x.dataset.answer===q.answer)x.classList.add("correct")});let ok=chosen===q.answer;if(!ok)b.classList.add("wrong");let fb=document.getElementById("quizFeedback");fb.textContent=ok?"সঠিক উত্তর! +10 XP":"সঠিক উত্তর: "+q.options[q.answer];state.quizPlayed++;if(ok){state.quizCorrect++;quizState.correct++;quizState.score+=10;addXP(10);markDaily();confetti()}else{state.lives=Math.max(0,state.lives-1);state.wrong.push(q.q)}saveState();document.getElementById("nextQuestion").classList.remove("hidden")}));
let nq=document.getElementById("nextQuestion");if(nq)nq.addEventListener("click",()=>{quizState.index++;quizState.answered=false;if(quizState.index>=quizState.qs.length)quizState.finished=true;render()});
let rq=document.getElementById("restartQuiz");if(rq)rq.addEventListener("click",()=>{quizState=null;go("practice")});
let ff=document.getElementById("friendForm");if(ff)ff.addEventListener("submit",e=>{e.preventDefault();let name=String(new FormData(ff).get("friend")||"").trim();if(name&& !state.friends.includes(name)){state.friends.push(name);saveState();render();toast("লোকাল তালিকায় বন্ধু যোগ হয়েছে")}else toast("নামটি ফাঁকা বা আগে থেকেই আছে")});
let pf=document.getElementById("profileForm");if(pf)pf.addEventListener("submit",e=>{e.preventDefault();let fd=new FormData(pf);state.name=String(fd.get("name")||"").trim();state.email=String(fd.get("email")||"").trim();saveState();render();toast("প্রোফাইল সেভ হয়েছে")});
let st=document.getElementById("soundToggle");if(st)st.addEventListener("change",()=>{state.settings.sound=st.checked;saveState()});
let mt=document.getElementById("motionToggle");if(mt)mt.addEventListener("change",()=>{state.settings.reduceMotion=mt.checked;saveState()});
let ex=document.getElementById("exportData");if(ex)ex.addEventListener("click",()=>download("funglot-play-backup.json",JSON.stringify(state,null,2)));
let im=document.getElementById("importData");if(im)im.addEventListener("click",()=>{let inp=document.createElement("input");inp.type="file";inp.accept=".json";inp.onchange=async()=>{try{let d=JSON.parse(await inp.files[0].text());if(!d||typeof d!=="object"||!Array.isArray(d.completed))throw Error("ব্যাকআপ ফরম্যাট সঠিক নয়");state={...DEFAULT_STATE,...d};saveState();render();toast("ব্যাকআপ ইমপোর্ট হয়েছে")}catch(e){toast("ইমপোর্ট ব্যর্থ: "+e.message)}};inp.click()});
let reset=document.getElementById("resetData");if(reset)reset.addEventListener("click",()=>showModal("ডেটা রিসেট করবেন?","এই ব্রাউজারের প্রোফাইল, শব্দ, XP ও অগ্রগতি মুছে যাবে।",()=>{localStorage.removeItem(STORE_KEY);state={...DEFAULT_STATE};currentPage="home";render();toast("লোকাল ডেটা রিসেট হয়েছে")}));
let pn=document.getElementById("premiumNotify");if(pn)pn.addEventListener("click",()=>toast("ধন্যবাদ! নোটিফিকেশন সার্ভার এখনো যুক্ত হয়নি।"));
}
function showModal(title,body,action){let host=document.getElementById("modalHost");host.innerHTML=`<div class="modal-backdrop"><section class="modal"><h2>${esc(title)}</h2><p class="muted">${esc(body)}</p><div class="actions"><button class="btn danger" id="modalYes">হ্যাঁ, রিসেট</button><button class="btn" id="modalNo">বাতিল</button></div></section></div>`;host.querySelector("#modalNo").onclick=()=>host.innerHTML="";host.querySelector("#modalYes").onclick=()=>{host.innerHTML="";action()}}
render();
</script>
</body>
</html>
